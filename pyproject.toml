[project]
name = "mlx-trainer"
version = "0.1.0"
description = "Pure MLX training framework for ModernBERT — no PyTorch, no TensorFlow. Just Metal."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "Alvaro Jimenez Martinez" },
]
dependencies = [
    "mlx>=0.24.0",
    "mlx-raclate>=0.1.0b1",
    "transformers>=4.40.0",
    "datasets>=2.0.0",
    "huggingface-hub>=0.20.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "seqeval>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mlx_trainer"]
